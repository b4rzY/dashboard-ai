name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gozo
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: gozo
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U gozo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://gozo:ci-test-only-password@127.0.0.1:55432/gozo?schema=public
      APP_URL: http://localhost:3000
      DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npm run cloudflare:build
